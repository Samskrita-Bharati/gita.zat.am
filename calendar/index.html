<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Challenges</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="./calendar.css" />
  </head>
  <body data-page="contest">
    <div id="navbar-mount"></div>
    <main class="daily-challenges-page">
      <header class="daily-challenges-header">
        <span class="daily-challenges-eyebrow">Zat.am Community</span>
        <h1>Shloka Schedule</h1>
        <p>Pick a shloka to play a game. See if you can complete them all!</p>
      </header>
      <section class="calendar" aria-label="Daily challenges calendar">
        <div class="calendar-heading">
          <a class="calendar-nav" id="previousMonth" href="#" aria-label="Previous month">&lt;&lt;</a>
          <h2 id="monthHeading" aria-live="polite"></h2>
          <a class="calendar-nav" id="nextMonth" href="#" aria-label="Next month">&gt;&gt;</a>
        </div>
        <p id="calendarLoadStatus" class="calendar-load-status" role="status"></p>
        <div class="calendar-grid" id="calendarGrid" role="grid"></div>
      </section>
      <section class="calendar-details" aria-labelledby="selectedDateHeading" hidden>
        <h2 id="selectedDateHeading">Shlokas</h2>
        <p class="completion-note">Completion marks are saved in this browser.</p>
        <div id="selectedDateVerses" aria-live="polite">Loading shlokas…</div>
      </section>
    </main>
    <div class="game-picker" id="gamePicker" role="group" aria-label="Choose a game" hidden></div>
    <script type="module" src="../navbar/navbar-loader.js"></script>
    <script type="module" src="./calendar.js"></script>
  </body>
</html>
