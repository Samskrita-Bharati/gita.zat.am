<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Challenges</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="./calendar.css" />
  </head>
  <body data-page="contest">
    <div id="navbar-mount"></div>
    <main class="daily-challenges-page">
      <header class="daily-challenges-header">
        <span class="daily-challenges-eyebrow">Zat.am Community</span>
        <h1>Daily Challenges</h1>
        <p>Build your Sanskrit learning streak, one day at a time.</p>
      </header>
      <section class="calendar" aria-label="Daily challenges calendar">
        <div class="calendar-heading">
          <a class="calendar-nav" id="previousMonth" aria-label="Previous month">&larr;</a>
          <h2 id="monthHeading" aria-live="polite"></h2>
          <a class="calendar-nav" id="nextMonth" aria-label="Next month">&rarr;</a>
        </div>
        <section class="calendar-play" aria-labelledby="calendarPlayHeading">
          <h3 id="calendarPlayHeading" tabindex="-1">Play Gita Strands</h3>
          <p id="calendarPlayStatus" role="status">Loading shloka dates…</p>
          <div id="calendarVerseLinks" class="calendar-verse-links"></div>
        </section>
        <div class="calendar-grid" id="calendarGrid" role="grid"></div>
      </section>
    </main>
    <script type="module" src="../navbar/navbar-loader.js"></script>
    <script type="module">
      import { getDailySchedule, SCHEDULE_START } from "../shlokasToday/daily-schedule.mjs";

      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const firstChallengeDay = new Date(SCHEDULE_START.year, SCHEDULE_START.month - 1, SCHEDULE_START.day);
      const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
      const params = new URLSearchParams(window.location.search);
      const requestedMonth = params.get("month");
      const monthMatch = requestedMonth?.match(/^(\d{4})-(\d{2})$/);
      let visibleMonth = monthMatch
        ? new Date(Number(monthMatch[1]), Number(monthMatch[2]) - 1, 1)
        : new Date(today.getFullYear(), today.getMonth(), 1);
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const grid = document.getElementById("calendarGrid");
      const playHeading = document.getElementById("calendarPlayHeading");
      const playStatus = document.getElementById("calendarPlayStatus");
      const verseLinks = document.getElementById("calendarVerseLinks");
      const dateLabel = new Intl.DateTimeFormat("en", { dateStyle: "long" });
      let verses = [];
      let selectedDayButton;


      weekdays.forEach((weekday) => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = weekday;
        label.setAttribute("role", "columnheader");
        grid.appendChild(label);
      });

      function monthUrl(date) {
        const params = new URLSearchParams(window.location.search);
        params.set("month", `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`);
        return `${window.location.pathname}?${params.toString()}`;
      }

      function showVerseLinks(date, button, focus = false) {
        const { verses: scheduled } = getDailySchedule(verses, date);
        selectedDayButton?.setAttribute("aria-pressed", "false");
        selectedDayButton = button;
        button.setAttribute("aria-pressed", "true");
        playHeading.textContent = `Play Gita Strands · ${dateLabel.format(date)}`;
        playStatus.textContent = "Choose a shloka to play.";
        verseLinks.replaceChildren(...scheduled.map((verse) => {
          const url = new URL("../games/strands/", document.baseURI);
          url.searchParams.set("id", String(verse.id));
          const link = document.createElement("a");
          link.href = url.href;
          link.textContent = `Shloka ${verse.ch}.${verse.vn}`;
          return link;
        }));
        if (focus) playHeading.focus();
      }

      function renderCalendar() {
        const year = visibleMonth.getFullYear();
        const month = visibleMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cellCount = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        document.getElementById("monthHeading").textContent = new Intl.DateTimeFormat("en", {
          month: "long",
          year: "numeric",
        }).format(visibleMonth);
        document.getElementById("previousMonth").href = monthUrl(new Date(year, month - 1, 1));
        document.getElementById("nextMonth").href = monthUrl(new Date(year, month + 1, 1));
        grid.replaceChildren(...grid.querySelectorAll(".weekday"));

        for (let cellIndex = 0; cellIndex < cellCount; cellIndex += 1) {
          const dateNumber = cellIndex - firstDay + 1;
          const isInMonth = dateNumber >= 1 && dateNumber <= daysInMonth;
          const cell = document.createElement("div");
          cell.className = "day";
          cell.setAttribute("role", "gridcell");
          if (isInMonth) {
            const day = new Date(year, month, dateNumber);
            const available = verses.length > 0 && day >= firstChallengeDay && day <= today;
            const isToday = `${year}-${month}-${dateNumber}` === todayKey;
            const date = document.createElement(available ? "button" : "span");
            date.className = "day-number";
            date.textContent = dateNumber;
            if (isToday) cell.classList.add("today");
            if (available) {
              date.type = "button";
              date.setAttribute("aria-label", `Choose shlokas for ${dateLabel.format(day)}`);
              date.setAttribute("aria-pressed", "false");
              date.addEventListener("click", () => showVerseLinks(day, date, true));
              if (isToday) showVerseLinks(day, date);
            }
            cell.appendChild(date);
          }
          grid.appendChild(cell);
        }
      }

      renderCalendar();
      try {
        const response = await fetch(new URL("../assets/bhagavad-gita-verses.json", import.meta.url));
        if (!response.ok) throw new Error("Could not load shlokas");
        const data = await response.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("No shlokas found");
        verses = data;
        const monthStart = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth(), 1);
        const monthEnd = new Date(visibleMonth.getFullYear(), visibleMonth.getMonth() + 1, 0);
        playStatus.textContent = monthStart <= today && monthEnd >= firstChallengeDay && today >= firstChallengeDay
          ? "Select an available date below to see its shlokas."
          : "No shlokas are available for this month yet.";
        renderCalendar();
      } catch (error) {
        playStatus.textContent = "Shloka links are temporarily unavailable.";
        console.error("Calendar shloka links:", error);
      }
    </script>
  </body>
</html>
