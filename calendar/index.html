<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Challenges</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="./calendar.css" />
  </head>
  <body data-page="contest">
    <div id="navbar-mount"></div>
    <main class="daily-challenges-page">
      <header class="daily-challenges-header">
        <span class="daily-challenges-eyebrow">Zat.am Community</span>
        <h1>Daily Challenges</h1>
        <p>Build your Sanskrit learning streak, one day at a time.</p>
      </header>
      <section class="calendar" aria-label="Daily challenges calendar">
        <div class="calendar-heading">
          <a class="calendar-nav" id="previousMonth" aria-label="Previous month">&larr;</a>
          <h2 id="monthHeading" aria-live="polite"></h2>
          <a class="calendar-nav" id="nextMonth" aria-label="Next month">&rarr;</a>
        </div>
        <div class="calendar-grid" id="calendarGrid" role="grid"></div>
      </section>
    </main>
    <script type="module" src="../navbar/navbar-loader.js"></script>
    <script type="module">
      import {
        getDateKey,
        getMonthKey,
        getScheduleForDate,
        loadSchedule,
        loadVerses,
      } from "../dailyChallenge/dailyChallenge.js";
      import { menu } from "../games/shared/gamesList.js";

      const today = new Date();
      const todayKey = getDateKey(today);
      const params = new URLSearchParams(window.location.search);
      const requestedMonth = params.get("month");
      const monthMatch = requestedMonth?.match(/^(\d{4})-(\d{2})$/);
      let visibleMonth = monthMatch
        ? new Date(Number(monthMatch[1]), Number(monthMatch[2]) - 1, 1)
        : new Date(today.getFullYear(), today.getMonth(), 1);
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const grid = document.getElementById("calendarGrid");
      let schedule = [];
      let versesById = new Map();

      try {
        [schedule, versesById] = await Promise.all([
          loadSchedule(),
          loadVerses().then((verses) => new Map(verses.map((verse) => [String(verse.id), verse]))),
        ]);
      } catch (error) {
        console.error("Unable to load calendar schedule:", error);
      }

      weekdays.forEach((weekday) => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = weekday;
        label.setAttribute("role", "columnheader");
        grid.appendChild(label);
      });

      function monthUrl(date) {
        const params = new URLSearchParams(window.location.search);
        params.set("month", getMonthKey(date));
        return `${window.location.pathname}?${params.toString()}`;
      }

      function gameUrl(game, dateKey, shlokaId) {
        const suffix = game.dir.endsWith(".html") ? "" : "/";
        const url = new URL(`../${game.dir}${suffix}`, window.location.href);
        url.searchParams.set("challengeDate", dateKey);
        url.searchParams.set("shlokaId", String(shlokaId));
        return url.href;
      }

      function renderDayEvents(cell, dateKey) {
        if (dateKey > todayKey) return;

        const entry = getScheduleForDate(schedule, dateKey);
        if (!entry) return;

        const events = document.createElement("div");
        events.className = "day-events";

        entry.gameIds.forEach((gameId, index) => {
          const game = menu.find((item) => Number(item.id) === Number(gameId));
          const verse = versesById.get(String(entry.shlokaIds[index]));
          if (!game || !verse) return;

          const event = document.createElement("a");
          event.className = "day-event";
          event.href = gameUrl(game, dateKey, verse.id);
          event.title = `${game.title.trim()}: ${verse.ch}.${verse.vn}`;
          event.textContent = event.title;
          events.appendChild(event);
        });

        if (events.childElementCount) {
          cell.classList.add("has-events");
          cell.appendChild(events);
        }
      }

      function renderCalendar() {
        const year = visibleMonth.getFullYear();
        const month = visibleMonth.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const cellCount = Math.ceil((firstDay + daysInMonth) / 7) * 7;
        document.getElementById("monthHeading").textContent = new Intl.DateTimeFormat("en", {
          month: "long",
          year: "numeric",
        }).format(visibleMonth);
        document.getElementById("previousMonth").href = monthUrl(new Date(year, month - 1, 1));
        document.getElementById("nextMonth").href = monthUrl(new Date(year, month + 1, 1));
        grid.replaceChildren(...grid.querySelectorAll(".weekday"));

        for (let cellIndex = 0; cellIndex < cellCount; cellIndex += 1) {
          const dateNumber = cellIndex - firstDay + 1;
          const isInMonth = dateNumber >= 1 && dateNumber <= daysInMonth;
          const cell = document.createElement("div");
          cell.className = "day";
          cell.setAttribute("role", "gridcell");
          if (isInMonth) {
            const date = document.createElement("span");
            date.className = "day-number";
            date.textContent = dateNumber;
            const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(dateNumber).padStart(2, "0")}`;
            if (dateKey === todayKey) cell.classList.add("today");
            cell.appendChild(date);
            renderDayEvents(cell, dateKey);
          }
          grid.appendChild(cell);
        }
      }

      renderCalendar();
    </script>
  </body>
</html>
