<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>गीता gamified by शतम् 🧩 gg.zat.am</title>
    <!-- font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
    />
    <!-- styles -->
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./shlokasToday/shlokasToday.css" />
  </head>

  <body data-page="games">
    <div id="navbar-mount"></div>

    <!-- =========================
     HERO
========================= -->

    <section class="shlokas-today">
      <div class="shlokas-layout">
        <div class="shlokas-heading">
          <h2 class="shlokas-title">
            <span class="shlokas-title-line">Shlokas for</span>
            <span class="shlokas-title-line" id="shlokasDateValue">Today</span>
          </h2>
          <div class="shlokas-accent" aria-hidden="true"></div>
          <nav class="shlokas-date-navigation" aria-label="Choose a date">
            <a id="previousShlokaDay" href="#" aria-label="Previous day">&lt;&lt;</a>
            <a id="nextShlokaDay" href="#" aria-label="Next day">&gt;&gt;</a>
          </nav>
        </div>

        <div class="today-verses" id="todayVerses" aria-live="polite">
          <p class="verses-loading">Loading today's shlokas…</p>
        </div>
      </div>
    </section>

    <footer style="text-align: center; padding: 20px">
      <a href="./legal/privacy.html" target="_blank">Privacy Policy</a>
    </footer>
    <!-- javascript -->
    <script type="module" src="./app.js"></script>
    <script type="module" src="./navbar/navbar-loader.js"></script>
  </body>
</html>
