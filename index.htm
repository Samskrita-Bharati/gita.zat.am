<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gg.zat.am</title>
<script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap");
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: "Montserrat", sans-serif;
  background-color: #031927;
}
.coming-soon {
  margin-left: 50px;
  font-size: 4rem;
  color: #9dd1f1;
}
.small {
  font-size: 2rem;
}
.floating-img {
  width: 150px;
  height: 150px;
  /* position: absolute; */
  animation: floating 3s ease-in-out infinite;
}

@media (max-height: 500px) {
  .coming-soon {
    font-size: 4rem;
    color: #9dd1f1;
  }

  .small {
    font-size: 2rem;
  }

  .floating-img {
    width: 100px;
    height: 100px;
  }
}

@keyframes floating {
  0% {
    transform: translate(0, 0px);
  }
  50% {
    transform: translate(0, 15px);
  }
  100% {
    transform: translate(0, -0px);
  }
}

</style>
</head>
<body>
<img src="awardg.png" class="floating-img" style="width:50px;height:50px">
  <h2 class='coming-soon'>गीता सुगीता कर्तव्या ...<br>
  <span id="cs" class='coming-soon small'>Coming soon...</span>
  </h1>
    <img src="gg.zat.am-wa.jpg">
    <p id="samscs" class="floating-img" style="color:white">शीघ्रम् आगमिष्यति...</p>
<script>
const targetDate = new Date("2026-12-20T00:00:00");
const now = new Date();

// 2. Calculate the difference in milliseconds
const difference = targetDate - now;

// 3. Convert milliseconds to days (1000ms * 60s * 60m * 24h)
const daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));

document.getElementById("cs").innerHTML+=` in <b>${daysLeft}</b> days !!`;
//Sanscript.t(String(daysLeft),'iast', 'devanagari');
document.getElementById("samscs").innerHTML+=` <b>${Sanscript.t(String(daysLeft),'iast', 'devanagari')}</b> दिनानाम् अनन्तरम्`;
</script>
</body>
</html>
