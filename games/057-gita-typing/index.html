<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Hidden before first paint; authentication guard reveals authorized pages. -->
    <style>html:not(.gg-authenticated) { visibility: hidden !important; }</style>
    <script type="module" src="../shared/auth-guard.js"></script>
    <title>Bhagavad Gita Typing Game</title>
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../shared/game-theme.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1" >
    <script type="module">
      import {openScoreShare,showCompletedScoreShare,clearCompletedScoreShare} from "../shared/score-share.js";
      window.ggScoreShare={openScoreShare,showCompletedScoreShare,clearCompletedScoreShare};
    </script>
    <script src="script.js" defer></script>
    <link rel="icon" href="Gita_typing_game.png" type="image/x-icon">
    <link rel="manifest" href="manifest.json" >
  </head>
  <body data-page="games" class="zatam-themed-game">
    <div id="navbar-mount"></div>

    <main class="zatam-game-shell typing-shell">
      <header class="zatam-game-header">
        <h1 class="zatam-game-title">Bhagavad Gita Typing</h1>
      </header>

      <p id="dailyChallengeNotice" class="zatam-game-instructions" hidden></p>

      <section class="zatam-game-card typing-card" aria-label="Typing challenge">
        <p id="info">
          Type the highlighted word exactly as shown, including uppercase letters.
          Finish the shloka to see its English meaning.
        </p>

        <p id="reference"></p>
        <p id="quote" lang="sa-Latn"></p>

        <input
          id="typedValue"
          type="text"
          aria-label="Type the highlighted word"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        >

        <div id="message" role="status"></div>
        <p id="meaning"></p>

        <div class="zatam-game-actions">
          <button id="start" type="button" class="zatam-game-btn zatam-game-btn-primary">
            Start Game
          </button>
          <button id="share" type="button" class="zatam-game-btn zatam-game-btn-secondary"
                  onclick="ShareIt()" onmouseout="outFunc()">
            Share Result
            <span id="myTooltip" class="typing-tooltip" aria-live="polite"></span>
          </button>
        </div>

        <div id="viswaroopa"></div>
      </section>

      <fieldset id="settings" class="typing-settings">
        <legend>Shloka progression</legend>
        <label><input type="radio" id="seq" name="progression" value="0" checked> Sequential</label>
        <label><input type="radio" id="rand" name="progression" value="1"> Random</label>
        <label><input type="radio" id="nectar" name="progression" value="2"> 51 key verses</label>
      </fieldset>
    </main>
    <script>
      // Old offline caches contain an unauthenticated game page.
      // Disable this game's legacy service worker and delete its cache.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => {
            if (registration.scope.includes("/games/057-gita-typing/")) {
              registration.unregister();
            }
          });
        }).catch(console.warn);
      }
      if ("caches" in window) {
        caches.delete("gita_typing_game").catch(console.warn);
      }
    </script>
  <footer>
    <span style="white-space: nowrap"> &copy; 2023 <a href="https://www.pradeepd.com/hobbies/apps">Pradeep D</a>, <a href="https://www.iseek.page">iSeek</a>. Ref: T.N. Sethumadhavan, 2010, "Srimad Bhagavad Gita", esamskriti.com </span>
 </footer>
  

    <!-- Shared Zat.am Navbar -->
    <script
      type="module"
      src="../../navbar/navbar-loader.js"
    ></script>
</body>
</html>
