<!doctype html>
<html lang="en">
  <head>
    <!-- Require login before showing the game -->
    <style>
      html:not(.gg-authenticated) {
        visibility: hidden !important;
      }

    <script type="module" src="../shared/auth-guard.js"></script>
    <meta charset="UTF-8" />

      crossorigin

    <link
      rel="stylesheet"
      crossorigin
      href="../../games/strands/built/index-D96ACROs.css"
    />
    <style>
      .result-card .gg-strands-share-action {
        display: block;
        width: 100%;
        margin: 13px 0 9px;
        padding: 12px 16px;
        border: 2px solid #f6b23b;
        border-radius: 11px;
        background: #0b2b4f;

    <div id="root"></div>
    <script type="module" src="./share-bridge.js"></script>
    <script>
      // Keep shared navigation at its existing portal URL in development and production.
      // The game build must not bundle or replace the portal's shared navbar files.
      const navbarLoader = document.createElement("script");
      navbarLoader.type = "module";
      navbarLoader.src = new URL(
        "../../navbar/navbar-loader.js",
        document.baseURI,
      ).href;
      document.body.appendChild(navbarLoader);
    </script>
  </body>
