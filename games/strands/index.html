<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf2" />
    <title>Gita Strands | Gita Zat.am</title>
    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../shared/game-theme.css" />
  </head>
  <body class="zatam-themed-game gita-strands-page" data-page="games">
    <div id="navbar-mount"></div>
    <header class="strands-page-header">
       <h1>Gita Strands</h1>
      <p>Connect Sanskrit letters to discover the hidden words.</p>
    </header>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Keep shared navigation at its existing portal URL in development and production.
      // The game build must not bundle or replace the portal's shared navbar files.
      const navbarLoader = document.createElement('script');
      navbarLoader.type = 'module';
      navbarLoader.src = new URL('../../navbar/navbar-loader.js', document.baseURI).href;
      document.body.appendChild(navbarLoader);
    </script>
  </body>
</html>
