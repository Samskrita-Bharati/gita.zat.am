<!DOCTYPE html>
<html>
<head>
	<script src="https://cdn.jsdelivr.net/npm/@sanskrit-coders/sanscript@1.1.0/sanscript.min.js"></script>
	<meta charset="utf-8" />
	<title>BodhaPlay scrambler</title>
	<script type="module">
		import { getShlokaTextFromUrl, splitShlokaWords, splitWordIntoGraphemes } from "../shared/shloka-utils.js";
		import zim from "https://zimjs.org/cdn/019/zim_pizzazz";
		let items = [];
		let words = [];
		let remainingWords = [];
		let gameId = null;
		let currentWordIndex = 0;
		let scrambler;
		let emitter;
		let totalScore = 0;
		let score = 0;
		function done() {
			totalScore += score;
			emitter.spurt(150);
			new Label(score).addTo(items[currentWordIndex]);
			items[currentWordIndex].alpha = 0.3;
			window.setTimeout(function () {
				scrambler.dispose();
				startNextWord();
			}, 1000);
		}
		function startNextWord() {
			if (remainingWords.length === 0) {
				const devanagariScore = Sanscript.t(String(totalScore), "itrans", "devanagari");
				const end = new Pane(`Total : ${totalScore} = ${devanagariScore}\n\n\n`, yellow);
				const cancel = new Button(120, 50, "Done", red).center(end).mov(-100);
				const redo = new Button(120, 50, "पुनः 🤔", green).center(end).mov(100);
				cancel.on("click", () => end.hide());
				redo.on("click", () => window.location.reload());
				end.show();
				end.noMouse();
				timeout(1, () => end.mouse());
				return;
			}

			const randomIndex = rand(remainingWords.length - 1);
			const currentWord = remainingWords.splice(randomIndex, 1)[0];
			currentWordIndex = currentWord.index;
			score = 0;
			const graphemes = splitWordIntoGraphemes(currentWord.word);
			const tiles = graphemes.map((letter) => new zim.Label({
				text: letter,
				color: pink.lighten(.9),
				size: 56,
				backing: new zim.Rectangle(150, 150, new RadialColor([purple, pink], [0, 1], 0, 0, 100, 0, 0, 0)),
				align: CENTER,
				valign: CENTER,
			}));
			const tileSet = new Tile({ obj: tiles, unique: true, cols: 9, rows: 1, spacingV: 5 });
			scrambler = new Scrambler({ tile: tileSet, keys: graphemes, keyProperty: "text" }).pos(50, -20, CENTER, CENTER);
			scrambler.on("complete", done);
			scrambler.on("pressup", () => score++);
			S.update();
		}
		const search = window.location.search;
		const idValues = new URLSearchParams(search).getAll("id");
		const parsedId = idValues.length === 1 ? idValues[0] : null;
		const numericId = parsedId && /^[1-9]\d*$/.test(parsedId) ? Number(parsedId) : null;
		gameId = Number.isSafeInteger(numericId) ? numericId : null;
		const shlokaText = await getShlokaTextFromUrl(search);
		words = splitShlokaWords(shlokaText);
		console.group("[z18] Shloka game input");
		console.log("Requested shloka id:", gameId ?? "today's default");
		console.log("Shloka text:", shlokaText);
		console.log("Words:", words);
		console.log("Word grapheme segments:");
		words.forEach((word, index) => {
			console.log(`${index + 1}. ${word}`, splitWordIntoGraphemes(word));
		});
		console.groupEnd();
		if (words.length === 0) {
			document.body.textContent = "No shloka found for this id.";
			throw new Error("No shloka text available for this game.");
		}
		const assets = ["gf_Changa"];
		const path = "https://zat.am/bp26/img/";
		new Frame(FIT, 1024, 768, light, purple.darken(.5), ready, assets, path);
		function ready() {
			const bar = new Rectangle(W, 40, black).addTo();
			F.makeIcon({ box: black }).scaleTo(bar, 90, 90).loc(10, 3);
			new Label("श्लोक - " + (gameId ?? "आज"), 25, "Changa", pink).pos(0, 2, CENTER, CENTER, bar);
			items = [];
			loop(words.length, i => {
				const box = new Container(100, 100).reg(CENTER);
				new Rectangle(100, 100, white, darker, 2, 10).addTo(box);
				// Keep the image slots in place; image content is intentionally blank.
				box.mouseChildren = false;
				items.push(box);
			});
			const list = new List({
				backdropColor: white,
				paddingH: 5,
				valign: TOP,
				indent: 2,
				width: W,
				height: 100,
				viewNum: 15,
				list: items,
				dropCopy: false,
				vertical: false,
				dropWidth: 100,
				dropHitTest: "reg",
				dropEnd: false
			}).loc(0, 40);
			remainingWords = words.map((word, index) => ({ word, index }));
			startNextWord();
			emitter = new Emitter({
				obj: new Rectangle(15, 15, [purple, pink, green]),
				startPaused: true,
				random: {
					scale: { min: 1, max: 4 },
					rotation: { min: 0, max: 360 }
				},
				angle: { min: 180, max: 270 },
				vertical: true,
				height: scrambler.height,
				width: 10,
				force: { min: 4, max: 8 },
				num: 5 // five at a time
			}).pos(50, 0, CENTER, CENTER);
		}
	</script>
	<meta name="viewport" content="width=device-width, user-scalable=no" />
</head>
<body></body>
</html>
