<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Challenges</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #173b35;
        background: #f5f7f2;
      }

      * { box-sizing: border-box; }
      body { margin: 0; }
      main { width: min(960px, calc(100% - 32px)); margin: 48px auto; }
      h1 { margin: 0 0 28px; font-size: clamp(2rem, 5vw, 3rem); }
      .calendar { overflow: hidden; border: 1px solid #d7e1d7; border-radius: 18px; background: white; box-shadow: 0 16px 40px #173b3510; }
      .calendar-heading { padding: 22px 24px; border-bottom: 1px solid #e4ebe3; font-size: 1.25rem; font-weight: 700; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .weekday { padding: 14px 8px; background: #f0f5ef; color: #5f746c; text-align: center; font-size: .8rem; font-weight: 700; }
      .day { min-height: 92px; padding: 12px; border-top: 1px solid #e4ebe3; border-right: 1px solid #e4ebe3; }
      .day:nth-child(7n) { border-right: 0; }
      .day-number { font-size: .9rem; font-weight: 600; }
      .day.today .day-number { display: inline-grid; width: 30px; height: 30px; place-items: center; border-radius: 50%; color: white; background: #24745d; }
      @media (max-width: 600px) {
        main { margin: 28px auto; }
        .day { min-height: 64px; padding: 8px 5px; }
        .weekday { padding: 10px 2px; font-size: .68rem; }
      }
    </style>
  </head>
  <body data-page="contest">
    <div id="navbar-mount"></div>
    <main>
      <h1>Daily Challenges</h1>
      <section class="calendar" aria-label="Empty daily challenges calendar">
        <div class="calendar-heading" id="monthHeading"></div>
        <div class="calendar-grid" id="calendarGrid" role="grid"></div>
      </section>
    </main>
    <script type="module" src="../navbar/navbar-loader.js"></script>
    <script>
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      document.getElementById("monthHeading").textContent = new Intl.DateTimeFormat("en", {
        month: "long",
        year: "numeric",
      }).format(today);

      const grid = document.getElementById("calendarGrid");
      weekdays.forEach((weekday) => {
        const label = document.createElement("div");
        label.className = "weekday";
        label.textContent = weekday;
        label.setAttribute("role", "columnheader");
        grid.appendChild(label);
      });

      for (let cellIndex = 0; cellIndex < 42; cellIndex += 1) {
        const dateNumber = cellIndex - firstDay + 1;
        const isInMonth = dateNumber >= 1 && dateNumber <= daysInMonth;
        const cell = document.createElement("div");
        cell.className = "day";
        cell.setAttribute("role", "gridcell");
        if (isInMonth) {
          const date = document.createElement("span");
          date.className = "day-number";
          date.textContent = dateNumber;
          if (dateNumber === today.getDate()) cell.classList.add("today");
          cell.appendChild(date);
        }
        grid.appendChild(cell);
      }
    </script>
  </body>
</html>
