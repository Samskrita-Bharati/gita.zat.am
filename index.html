<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./shlokasToday/shlokasToday.css" />

  <body data-page="games">
    <div id="navbar-mount"></div>

========================= -->
